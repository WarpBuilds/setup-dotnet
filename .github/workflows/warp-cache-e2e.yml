name: warp-cache-e2e

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save:
    name: save (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            warp-ubuntu-latest-x64-2x,
            warp-windows-2022-x64-4x,
            warp-macos-15-arm64-6x
          ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The cache key is derived from this file's hash, so a per-run value
      # guarantees a fresh key and a genuine miss -> save -> hit round trip.
      - name: Write run-unique lock file and project
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p warp-fixture
          printf '{"version":1,"warp":"%s-%s","dependencies":{}}\n' \
            "$RUN_ID" "$RUN_ATTEMPT" > warp-fixture/packages.lock.json
          cat > warp-fixture/app.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net9.0</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Newtonsoft.Json" Version="13.0.3" />
            </ItemGroup>
          </Project>
          EOF

      - name: Setup .NET
        id: setup
        uses: ./
        with:
          dotnet-version: '9.0'
          cache: true
          cache-dependency-path: warp-fixture/packages.lock.json

      - name: Assert cache miss on a fresh key
        shell: bash
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "false" ]; then
            echo "expected a miss on a run-unique key, got cache-hit=$CACHE_HIT"
            exit 1
          fi

      # Give the post step real bytes to upload.
      - name: Populate the NuGet package cache
        shell: bash
        run: dotnet restore warp-fixture/app.csproj

  restore:
    name: restore (${{ matrix.os }})
    needs: save
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            warp-ubuntu-latest-x64-2x,
            warp-windows-2022-x64-4x,
            warp-macos-15-arm64-6x
          ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Write the same run-unique lock file
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p warp-fixture
          printf '{"version":1,"warp":"%s-%s","dependencies":{}}\n' \
            "$RUN_ID" "$RUN_ATTEMPT" > warp-fixture/packages.lock.json

      - name: Setup .NET
        id: setup
        uses: ./
        with:
          dotnet-version: '9.0'
          cache: true
          cache-dependency-path: warp-fixture/packages.lock.json

      - name: Assert the cache saved by the save job was restored
        shell: bash
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            echo "expected an exact-key hit on the cache saved by the save job"
            exit 1
          fi
